coverage:
  status:
    project:
      default:
        # Fixed floor (user-approved 90%): UI glue files (session layers,
        # DOM/Pixi wiring) dilute project % while e2e covers the real
        # behavior under SwiftShader.
        target: 90%
    patch:
      default:
        target: 60%
      # Browser-only glue (WebRTC, WebSocket, DOM, Pixi wiring) cannot run in
      # node Vitest — e2e covers it under SwiftShader. Lower patch floor.
      signaling:
        target: 30%
        paths:
          - "src/signaling/"
      ui:
        target: 40%
        paths:
          - "src/ui/"
          - "src/render/"
          - "src/app/"
  comment:
    layout: "reach, diff, flags, files"
