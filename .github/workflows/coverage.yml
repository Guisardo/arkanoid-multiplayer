name: Coverage

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --coverage --reporter=default --reporter=junit --outputFile.junit=test-report.junit.xml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      # codecov/test-results-action@v1 is deprecated and vendors its own old
      # `codecov` binary, which now fails the TLS handshake against codecov.io
      # ("SSL alert number 40") and fails the whole job on every run. v5 of the
      # main action covers the same ground via `report_type: test_results` and
      # downloads a current CLI, which the step above already does successfully.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
